esphome:
  name: spabad-balboa
  friendly_name: Spabad Balboa

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: "Karmskogs_IoT"
  password: "TeleCaster"

api:

ota:
  platform: esphome

logger:

uart:
  - id: uart_bus
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 115200

external_components:
  - source:
      type: git
      url: https://github.com/brianfeucht/esphome-balboa-spa
      ref: main
    components: [ balboa_spa ]

balboa_spa:
  id: my_balboa
  uart_id: uart_bus
  flow_control_pin: GPIO21

climate:
  - platform: balboa_spa
    name: "Spabad Temperatur"
