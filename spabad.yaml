esphome:
  name: spabad-balboa
  friendly_name: Spabad Balboa

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

wifi:
  ssid: "Karmskogs_IoT"
  password: "TeleCaster"

api:

ota:
  platform: esphome

# Stäng av fysisk serieport-loggning helt för att förhindra krasch vid boot:
logger:
  baud_rate: 0
  level: DEBUG

# Använd hårdvaru-UART0 utan konflikter:
uart:
  - id: uart_bus
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 115200
    rx_buffer_size: 512

external_components:
  - source:
      type: git
      url: https://github.com/brianfeucht/esphome-balboa-spa
      ref: main
    components: [ balboa_spa ]

balboa_spa:
  id: my_balboa
  uart_id: uart_bus
  spa_temp_scale: C
  esphome_temp_scale: C

climate:
  - platform: balboa_spa
    balboa_spa_id: my_balboa
    name: "Spabad Termostat"
    visual:
      min_temperature: 15 °C
      max_temperature: 40 °C
      temperature_step: 0.5 °C
